[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-nn"
version = "2.0.0"
description = "Predicción de enfermedad cardíaca con una red neuronal (PyTorch) sobre el dataset Heart Disease."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "matplotlib>=3.8",
]

[project.scripts]
heart-nn-train = "heart_nn.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["api", "web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# Convención ML: X / X_train en mayúscula.
ignore = ["N803", "N806"]
